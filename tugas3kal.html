<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Kalkulator Sederhana</h1>

        <div class="form-group">
            <label for="bilangan1">Input Bilangan 1</label>
            <input type="number" id="bilangan1" placeholder="Masukkan bilangan pertama">
        </div>

        <div class="form-group">
            <label for="bilangan2">Input Bilangan 2</label>
            <input type="number" id="bilangan2" placeholder="Masukkan bilangan kedua">
        </div>

        <div class="button-group">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">−</button>
            <button onclick="hitung('*')">×</button>
            <button onclick="hitung('/')">÷</button>
        </div>

        <div class="form-group">
            <label for="output">Output</label>
            <input type="text" id="output" readonly>
        </div>
    </div>


    <script>
        function hitung(operator) {

            let bilangan1 = parseFloat(
                document.getElementById("bilangan1").value
            );

            let bilangan2 = parseFloat(
                document.getElementById("bilangan2").value
            );

            let hasil;

            // Memeriksa input
            if (isNaN(bilangan1) || isNaN(bilangan2)) {
                document.getElementById("output").value =
                    "Input belum lengkap";
                return;
            }

            // Proses aritmatika
            if (operator == "+") {
                hasil = bilangan1 + bilangan2;
            }
            else if (operator == "-") {
                hasil = bilangan1 - bilangan2;
            }
            else if (operator == "*") {
                hasil = bilangan1 * bilangan2;
            }
            else if (operator == "/") {

                if (bilangan2 == 0) {
                    document.getElementById("output").value =
                        "Tidak dapat dibagi 0";
                    return;
                }

                hasil = bilangan1 / bilangan2;
            }

            // Menampilkan hasil
            document.getElementById("output").value = hasil;
        }
    </script>

</body>
</html>
